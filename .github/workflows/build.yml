name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile internal/maya/runtime/maya_auto_rt.py scripts/enable_command_port.py
      - run: go test ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Windows amd64
        shell: pwsh
        run: |
          $v = "dev"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$v" -o dist/maya-auto.exe ./cmd/maya-auto
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/maya-auto-mcp.exe ./cmd/maya-auto
      - uses: actions/upload-artifact@v4
        with:
          name: maya-auto-windows-amd64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
